<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="24" height="24">
  <!-- Address conflation icon: a house with a housenumber tag floating above it. -->
  <!-- Plain attributes only (no CSS, no text) for JOSM's svgSalamander renderer; -->
  <!-- the digits are stroked straight-line paths. -->

  <!-- house body and roof -->
  <path d="m60 178h136v66h-136z" fill="#5b8def"/>
  <path d="m128 108-100 80h200z" fill="#353640"/>
  <!-- chimney -->
  <path d="m168 122h20v30h-20z" fill="#353640"/>
  <!-- door and window -->
  <path d="m114 204h28v40h-28z" fill="#fff"/>
  <path d="m72 194h24v22h-24z" fill="#fff"/>
  <path d="m160 194h24v22h-24z" fill="#fff"/>

  <!-- number tag floating above, with a pointer down to the roof -->
  <rect x="52" y="12" width="152" height="80" rx="12" ry="12" fill="#e37438"/>
  <path d="m114 92h28l-14 14z" fill="#e37438"/>

  <!-- digits "14" as strokes -->
  <g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="m82 42 16-12v52"/>
    <path d="m166 30-28 40h44"/>
    <path d="m166 30v52"/>
  </g>
</svg>
