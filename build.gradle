plugins {
    id 'java'
    id 'org.openstreetmap.josm' version '0.8.2'
}

// Plugin-Version is taken from project.version by gradle-josm-plugin. On
// release builds, set RELEASE_VERSION (the workflow does this from the git
// tag); otherwise fall back to a SNAPSHOT marker for local dev builds.
def releaseVersion = System.getenv('RELEASE_VERSION')
version = releaseVersion != null && !releaseVersion.isEmpty()
        ? releaseVersion
        : 'dev-SNAPSHOT'

josm {
    pluginName = 'better-address-conflation'
    josmCompileVersion = 19439
    manifest {
        description = 'Match address points to buildings using parcels (or Voronoi cells) and review the results by bucket'
        mainClass = 'org.openstreetmap.josm.plugins.addressconflation.AddressConflationPlugin'
        minJosmVersion = 19439
        iconPath = 'images/dialogs/address-conflation.svg'
        author = 'watmildon'
        website('https://github.com/watmildon/better-address-conflation')
        canLoadAtRuntime = true
    }
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += [
        '--add-exports=java.base/sun.security.action=ALL-UNNAMED',
        '--add-exports=java.desktop/com.sun.imageio.plugins.jpeg=ALL-UNNAMED',
        '--add-exports=java.desktop/com.sun.imageio.spi=ALL-UNNAMED'
    ]
}

repositories {
    mavenCentral()
}

dependencies {
    packIntoJar 'org.locationtech.jts:jts-core:1.20.0'
    // Also add as implementation so IDEs see JTS on the classpath
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

sourceSets {
    test {
        resources {
            srcDir 'test-data'
        }
    }
}

test {
    useJUnitPlatform()
    jvmArgs += [
        '--add-exports=java.base/sun.security.action=ALL-UNNAMED',
        '--add-exports=java.desktop/com.sun.imageio.plugins.jpeg=ALL-UNNAMED',
        '--add-exports=java.desktop/com.sun.imageio.spi=ALL-UNNAMED'
    ]
    maxHeapSize = '2g'
    testLogging {
        showStandardStreams = true
        events 'failed'
        exceptionFormat 'full'
    }
}
